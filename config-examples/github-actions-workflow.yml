name: AI-Powered Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'

jobs:
  # Job 1: AI Test Selection
  ai-test-selection:
    name: AI Test Selection
    runs-on: ubuntu-latest
    outputs:
      tests-to-run: ${{ steps.select-tests.outputs.tests }}
      should-run-all: ${{ steps.select-tests.outputs.run-all }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for AI analysis
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: AI Test Selection with Launchable
        id: select-tests
        uses: launchable/ai-test-selection@v1
        with:
          token: ${{ secrets.LAUNCHABLE_TOKEN }}
          confidence: 95
          time-limit: 10m
  
  # Job 2: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: ai-test-selection
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Unit Tests
        run: npm run test:unit -- --coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
  
  # Job 3: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: ai-test-selection
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      
      redis:
        image: redis:latest
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Integration Tests
        run: npm run test:integration
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          REDIS_HOST: localhost
  
  # Job 4: Visual Testing with AI
  visual-tests:
    name: Visual Testing (AI)
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Cypress
        run: npx cypress install
      
      - name: Run Applitools Visual Tests
        uses: applitools/eyes-github-actions@v1
        with:
          api-key: ${{ secrets.APPLITOOLS_API_KEY }}
          app-name: 'E-Commerce Platform'
          test-name: 'Visual Regression Suite'
          batch-name: 'CI Build ${{ github.run_number }}'
      
      - name: Run Cypress with Applitools
        run: npm run test:visual
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      
      - name: Upload Visual Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: visual-test-results
          path: |
            cypress/screenshots
            cypress/videos
  
  # Job 5: API Tests with AI
  api-tests:
    name: API Testing (AI)
    runs-on: ubuntu-latest
    needs: integration-tests
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate AI API Tests
        run: npm run test:api:ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      
      - name: Run API Tests
        run: npm run test:api
  
  # Job 6: E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    strategy:
      matrix:
        browser: [chrome, firefox, edge]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run E2E Tests
        uses: cypress-io/github-action@v5
        with:
          browser: ${{ matrix.browser }}
          start: npm run dev
          wait-on: 'http://localhost:3000'
      
      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-results-${{ matrix.browser }}
          path: |
            cypress/screenshots
            cypress/videos
  
  # Job 7: Security Scanning with AI
  security-scan:
    name: Security Scan (AI)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      
      - name: Run OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://localhost:3000'
      
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: |
            snyk-report.json
            zap-report.html
  
  # Job 8: Performance Testing with AI
  performance-tests:
    name: Performance Tests (AI)
    runs-on: ubuntu-latest
    needs: e2e-tests
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run AI-Powered Load Tests
        run: npm run test:performance
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
      
      - name: Upload Performance Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: performance/results
  
  # Job 9: AI Test Analysis & Reporting
  ai-analysis:
    name: AI Test Analysis
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, visual-tests, api-tests, e2e-tests, security-scan, performance-tests]
    if: always()
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Download all test results
        uses: actions/download-artifact@v3
      
      - name: AI-Powered Test Analysis
        uses: reportportal/ai-analysis@v1
        with:
          api-key: ${{ secrets.REPORTPORTAL_API_KEY }}
          project: 'ecommerce-testing'
          generate-insights: true
      
      - name: Generate AI Test Report
        run: npm run report:generate
      
      - name: Upload Comprehensive Report
        uses: actions/upload-artifact@v3
        with:
          name: ai-test-report
          path: test-results/
      
      - name: Post Comment with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('test-results/summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
  
  # Job 10: Deployment Gate
  deployment-gate:
    name: AI Deployment Decision
    runs-on: ubuntu-latest
    needs: ai-analysis
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: AI Deployment Gate
        run: |
          echo "AI analyzing deployment readiness..."
          # AI checks:
          # - Test pass rate > 95%
          # - No critical security vulnerabilities
          # - Performance within SLA
          # - Visual tests passed
          # AI decision: APPROVED
      
      - name: Deploy to Staging
        if: success()
        run: |
          echo "Deploying to staging..."
          # Deployment commands here

# Notification on failure
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [ai-analysis]
    if: failure()
    
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'AI Testing Pipeline Failed!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
