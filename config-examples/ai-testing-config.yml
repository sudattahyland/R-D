# AI Testing Configuration
# This file defines configuration for various AI testing tools and scenarios

# =============================================================================
# TEST GENERATION SETTINGS
# =============================================================================

test_generation:
  # AI model for test generation
  ai_model: "gpt-4"
  
  # Test generation preferences
  coverage_target: 95
  include_edge_cases: true
  include_security_tests: true
  include_performance_tests: true
  
  # Test data generation
  test_data:
    use_realistic_data: true
    faker_locale: "en_US"
    data_variety_level: "high"
    include_boundary_values: true
    include_invalid_data: true
  
  # Output preferences
  output_format: "jest"
  language: "typescript"
  test_framework: "cypress"

# =============================================================================
# VISUAL TESTING SETTINGS
# =============================================================================

visual_testing:
  # Applitools configuration
  applitools:
    enabled: true
    match_level: "Strict"  # Strict, Content, Layout, Exact
    ignore_displacements: true
    ignore_regions:
      - selector: "[data-testid='live-chat']"
        reason: "Dynamic widget"
      - selector: "[data-testid='recommendation']"
        reason: "Personalized content"
    
    # Responsive testing viewports
    viewports:
      - name: "Desktop"
        width: 1920
        height: 1080
      - name: "Tablet"
        width: 768
        height: 1024
      - name: "Mobile"
        width: 375
        height: 667
    
    # Browsers to test
    browsers:
      - name: "Chrome"
        version: "latest"
      - name: "Firefox"
        version: "latest"
      - name: "Safari"
        version: "latest"
      - name: "Edge"
        version: "latest"
  
  # Percy configuration
  percy:
    enabled: false
    min_height: 1024
    enable_javascript: true
    
  # Screenshot comparison threshold
  diff_threshold: 0.1  # 10% difference threshold

# =============================================================================
# API TESTING SETTINGS
# =============================================================================

api_testing:
  # AI-powered API test generation
  auto_generate_from_spec: true
  openapi_spec_path: "./openapi.json"
  
  # Test scenarios to generate
  scenarios:
    - happy_path
    - edge_cases
    - negative_tests
    - security_tests
    - performance_tests
  
  # Response validation
  validate_schema: true
  validate_status_codes: true
  validate_response_time: true
  
  # Performance thresholds (AI-suggested)
  performance:
    max_response_time: 200  # milliseconds
    timeout: 10000
    
  # Security testing
  security:
    check_sql_injection: true
    check_xss: true
    check_authentication: true
    check_authorization: true

# =============================================================================
# PERFORMANCE TESTING SETTINGS
# =============================================================================

performance_testing:
  # AI load pattern generation
  ai_behavior_simulation: true
  
  # Load test configuration
  load_profile:
    scenario: "normal_traffic"  # normal_traffic, peak_traffic, black_friday
    duration: "5m"
    
    # AI-optimized stages
    stages:
      - duration: "2m"
        target: 50
        name: "ramp_up"
      - duration: "5m"
        target: 100
        name: "steady_state"
      - duration: "2m"
        target: 0
        name: "ramp_down"
  
  # Performance thresholds (AI-calculated)
  thresholds:
    http_req_duration:
      - "p(95)<500"  # 95% of requests must complete in 500ms
      - "p(99)<1000"  # 99% of requests must complete in 1s
    http_req_failed:
      - "rate<0.01"  # Error rate must be less than 1%
  
  # User behavior simulation
  user_behaviors:
    think_time_min: 1  # seconds
    think_time_max: 5  # seconds
    conversion_rate: 0.15  # 15% of users complete purchase
    bounce_rate: 0.30  # 30% leave after first page

# =============================================================================
# SECURITY TESTING SETTINGS
# =============================================================================

security_testing:
  # AI-powered vulnerability scanning
  snyk:
    enabled: true
    severity_threshold: "high"
    fail_on_issues: true
    monitor_dependencies: true
  
  # OWASP ZAP
  zap:
    enabled: true
    scan_type: "full"  # quick, full
    ajax_spider: true
    
  # Security test scenarios
  tests:
    - sql_injection
    - xss
    - csrf
    - authentication_bypass
    - jwt_vulnerabilities
    - sensitive_data_exposure
    - insecure_deserialization
  
  # Compliance checking
  compliance:
    - OWASP_Top_10
    - PCI_DSS
    - GDPR

# =============================================================================
# E2E TESTING SETTINGS
# =============================================================================

e2e_testing:
  # Self-healing locators
  self_healing:
    enabled: true
    confidence_threshold: 0.85
    fallback_strategies:
      - "data-testid"
      - "text content"
      - "css selector"
      - "xpath"
      - "visual recognition"
  
  # Test execution
  parallel_execution: true
  max_parallel: 4
  retry_failed: true
  max_retries: 2
  
  # Video recording
  record_video:
    enabled: true
    on_failure_only: true
  
  # Screenshots
  screenshots:
    enabled: true
    on_failure_only: true

# =============================================================================
# TEST SELECTION & OPTIMIZATION
# =============================================================================

test_optimization:
  # AI test selection
  ai_test_selection:
    enabled: true
    provider: "launchable"
    confidence_level: 0.95
    max_time_budget: "10m"
  
  # Flaky test detection
  flaky_detection:
    enabled: true
    threshold: 0.15  # 15% failure rate
    auto_quarantine: true
    
  # Test prioritization
  prioritization:
    strategy: "risk_based"  # risk_based, time_based, coverage_based
    
# =============================================================================
# TEST ANALYTICS & REPORTING
# =============================================================================

analytics:
  # ReportPortal AI
  reportportal:
    enabled: true
    auto_analysis: true
    ml_suggestions: true
    
  # Test metrics to track
  metrics:
    - pass_fail_rate
    - execution_time
    - coverage
    - flakiness
    - failure_patterns
    
  # AI insights
  ai_insights:
    enabled: true
    failure_root_cause_analysis: true
    test_health_scoring: true
    optimization_recommendations: true

# =============================================================================
# CI/CD INTEGRATION
# =============================================================================

ci_cd:
  # Pipeline configuration
  pipeline:
    run_on_push: true
    run_on_pr: true
    run_scheduled: true
    schedule: "0 2 * * *"  # Daily at 2 AM
  
  # Test stages
  stages:
    - name: "unit_tests"
      required: true
      fail_fast: true
    - name: "integration_tests"
      required: true
      fail_fast: true
    - name: "visual_tests"
      required: false
      fail_fast: false
    - name: "e2e_tests"
      required: true
      fail_fast: false
    - name: "security_scan"
      required: true
      fail_fast: true
    - name: "performance_tests"
      required: false
      fail_fast: false
  
  # Deployment gates
  deployment_gates:
    min_pass_rate: 0.95
    max_critical_bugs: 0
    max_high_bugs: 3
    min_coverage: 80

# =============================================================================
# NOTIFICATION SETTINGS
# =============================================================================

notifications:
  # When to notify
  on_failure: true
  on_success: false
  on_flaky_tests: true
  
  # Channels
  slack:
    enabled: false
    webhook_url: ""
    channel: "#testing"
  
  email:
    enabled: true
    recipients:
      - "qa-team@example.com"

# =============================================================================
# ADVANCED AI FEATURES
# =============================================================================

advanced_ai:
  # Natural language test authoring
  nl_test_authoring:
    enabled: true
    model: "gpt-4"
    
  # Predictive test maintenance
  predictive_maintenance:
    enabled: true
    predict_breaking_changes: true
    suggest_test_updates: true
    
  # AI-powered debugging
  ai_debugging:
    enabled: true
    auto_suggest_fixes: true
    
  # Test data privacy
  synthetic_data:
    enabled: true
    gdpr_compliant: true
